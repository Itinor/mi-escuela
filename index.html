<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4B1A78">
<title>miescuela.com · Portal del alumno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--marca:#4B1A78;--marca2:#2E0F4A;--suave:#F7F3FB;--fondo:#F4F1F8;--tinta:#1C1426;--gris:#6B6178;--linea:#ECE6F3;--ok:#1F7A4D;--okf:#E5F4EC;--aviso:#B26A00;--avisof:#FFF3DF;--mal:#B42318;--malf:#FDECEA;--r:18px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Inter,system-ui,sans-serif;margin:0}
a{color:var(--marca);text-decoration:none}
button{font:inherit;cursor:pointer}
.oculto{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,var(--marca) 0%,var(--marca2) 100%)}
.login form{width:100%;max-width:380px;background:#fff;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.logo{display:flex;align-items:center;gap:10px}
.logo b{width:40px;height:40px;border-radius:12px;background:var(--marca);color:#fff;display:grid;place-items:center;font:700 15px Inter,system-ui,sans-serif}
.logo span{font:700 18px Inter,system-ui,sans-serif}
label{font-size:13px;font-weight:600;color:var(--gris);display:flex;flex-direction:column;gap:6px}
input,select{font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--linea);background:#fff;color:var(--tinta);width:100%}
input:focus,select:focus{outline:none;border-color:var(--marca)}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--marca);color:#fff;font-weight:600}
.btn.sec{background:var(--suave);color:var(--marca)}
.app{display:flex;min-height:100vh}
.lateral{width:250px;flex:none;background:#fff;border-right:1px solid var(--linea);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.lateral .logo{padding:0 8px 18px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--tinta);font-weight:500}
.nav a:hover{background:var(--suave)}
.nav a.activo{background:var(--marca);color:#fff}
.nav svg{width:20px;height:20px;flex:none}
.nav .grupo{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gris);padding:14px 12px 4px}
.cuerpo{flex:1;min-width:0;display:flex;flex-direction:column}
.barra{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 28px;background:var(--fondo);position:sticky;top:0;z-index:5}
.barra h1{font-size:24px}
.yo{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:4px 14px 4px 4px;border:0;color:var(--tinta)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--marca);color:#fff;display:grid;place-items:center;font:700 13px Inter,system-ui,sans-serif}
main{padding:4px 28px 40px;display:flex;flex-direction:column;gap:16px;max-width:1100px;width:100%}
.tarjeta{background:#fff;border-radius:var(--r);padding:18px;box-shadow:0 1px 2px rgba(28,20,38,.06);display:flex;flex-direction:column;gap:12px}
.tarjeta h2{font-size:17px}
.fila{display:flex;justify-content:space-between;align-items:center;gap:12px}
.rejilla{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.dato small{display:block;font-size:12px;font-weight:600;color:var(--gris)}
.dato b{font:700 32px/1.1 Inter,system-ui,sans-serif}
.dato span{font-size:12px;color:var(--gris)}
.hero{background:linear-gradient(135deg,var(--marca),var(--marca2));color:#fff;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:4px}
.hero p{margin:0;opacity:.85;font-size:14px}
.hero h2{font-size:28px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--suave);color:var(--marca);white-space:nowrap}
.chip.ok{background:var(--okf);color:var(--ok)}.chip.aviso{background:var(--avisof);color:var(--aviso)}.chip.mal{background:var(--malf);color:var(--mal)}
.progreso{height:10px;border-radius:999px;background:var(--linea);overflow:hidden}
.progreso i{display:block;height:100%;border-radius:999px;background:var(--marca)}
.lista{display:flex;flex-direction:column}
.lista .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--linea)}
.lista .it:first-child{border-top:0}
.lista .it .t{flex:1;min-width:0}
.lista .it .t b{display:block;font-size:14px;font-weight:600}
.lista .it .t span{font-size:12px;color:var(--gris)}
.nota{font:700 18px Inter,system-ui,sans-serif;min-width:48px;text-align:right}
.nota.vacia{color:#B8AFC4;font-size:13px;font-family:Inter,sans-serif;font-weight:600}
.barras{display:flex;flex-direction:column;gap:4px;width:100%;margin-top:6px}
.barras div{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--gris)}
.barras div span{width:44px;flex:none}.barras div span.v{width:40px;text-align:right}.barras em{flex:1;height:6px;border-radius:999px;background:var(--linea);overflow:hidden}.barras div i{height:100%;border-radius:999px;background:var(--marca);display:block}
.barras div.g i{background:#C9BCD9}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:2px}
.tabs button{border:0;background:#fff;color:var(--tinta);padding:9px 14px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap}
.tabs button.activo{background:var(--marca);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--gris);text-align:left;font-weight:600;padding:8px 6px;border-bottom:1px solid var(--linea)}
td{padding:10px 6px;border-bottom:1px solid var(--linea)}
td.num,th.num{text-align:right}
.vacio{text-align:center;color:var(--gris);padding:26px 10px;font-size:14px}
.vacio svg{width:40px;height:40px;color:#C9BCD9;display:block;margin:0 auto 8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}
.cal b{font-size:11px;color:var(--gris);padding:4px 0}
.cal span{padding:10px 0;border-radius:10px}
.cal span.hoy{background:var(--marca);color:#fff;font-weight:700}
.cal span.fuera{color:#C9BCD9}
.cal span{position:relative}
.cal span.sin{background:var(--fondo);color:var(--gris);text-decoration:line-through}
.cal span.examen{background:var(--avisof);color:var(--aviso);font-weight:700}
.cal span.evento,.cal span.junta,.cal span.inicio,.cal span.fin{background:var(--suave);color:var(--marca);font-weight:700}
.cal span.hoy.sin,.cal span.hoy.examen,.cal span.hoy.evento,.cal span.hoy.junta{background:var(--marca);color:#fff;text-decoration:none}
.coments{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--linea);padding-top:10px;margin-top:4px}
.coments .escribir{margin-top:2px}
.coments summary{cursor:pointer;color:var(--marca);font-size:13px;font-weight:600;list-style:none}
.coments summary::-webkit-details-marker{display:none}
details.coments[open] summary{margin-bottom:4px}
.leyenda-cal{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--gris)}
.leyenda-cal i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.campo{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--linea)}
.campo small{font-size:12px;color:var(--gris);font-weight:600}
.hor{display:flex;flex-direction:column}
.hor .b{display:grid;grid-template-columns:92px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--linea);align-items:center}
.hor .b:first-child{border-top:0}
.hor .h{font:600 14px Inter,system-ui,sans-serif}.hor .h span{display:block;font:500 12px Inter,sans-serif;color:var(--gris)}
.hor .c{border-left:4px solid var(--marca);padding:6px 12px;border-radius:4px 12px 12px 4px;background:var(--suave)}
.hor .c b{display:block;font-size:14px}.hor .c span{font-size:12px;color:var(--gris)}
.hor .b.ahora .c{background:var(--marca);color:#fff}.hor .b.ahora .c span{color:rgba(255,255,255,.8)}
.semana{display:grid;gap:4px;font-size:12px;position:relative}
.semana .cab{font-weight:700;color:var(--gris);text-align:center;padding:6px 0;font-size:12px}
.semana .cab.hoy{color:var(--marca)}
.semana .hr{color:var(--gris);font-size:11px;text-align:right;padding-right:6px;transform:translateY(-7px)}
.semana .celda{border-top:1px dashed var(--linea)}
.semana .cl{background:var(--suave);border-left:4px solid var(--marca);border-radius:4px 10px 10px 4px;padding:6px 8px;overflow:hidden;z-index:1}
.semana .cl b{display:block;font-size:12px;line-height:1.25}.semana .cl span{display:block;color:var(--gris);font-size:11px}
.semana .cl.ahora{background:var(--marca);color:#fff}.semana .cl.ahora span{color:rgba(255,255,255,.8)}
.semana .libre{grid-row:2/-1;background:repeating-linear-gradient(135deg,transparent 0 8px,#FAF8FC 8px 16px);border-radius:10px}
.dias{display:flex;gap:4px;margin-bottom:6px}
.dias button{flex:1;border:0;border-radius:10px;padding:8px 0;font-weight:700;font-size:12px;background:var(--suave);color:var(--tinta)}
.dias button.sin{color:#B8AFC4;background:none}
.dias button.activo{background:var(--marca);color:#fff}
.tarea{border:1px solid var(--linea);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.tarea h3{font-size:16px}
.tarea p{margin:0;font-size:14px}
.tarea ul{margin:0;padding-left:18px;font-size:14px;color:var(--tinta)}
.tarea .meta{font-size:12px;color:var(--gris)}
.tarea .acc{display:flex;gap:8px;flex-wrap:wrap}
.tarea .acc .btn{padding:9px 14px;font-size:13px}
.coment{background:var(--suave);border-radius:10px;padding:8px 10px;font-size:13px}
.chat{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
.contactos .it{cursor:pointer;border-radius:12px;padding:10px;border-top:0}
.contactos .it.activo{background:var(--suave)}
.burbujas{display:flex;flex-direction:column;gap:8px;min-height:240px;max-height:52vh;overflow:auto;padding:4px 2px}
.burbuja{max-width:78%;padding:9px 12px;border-radius:16px 16px 16px 4px;background:var(--suave);font-size:14px}
.burbuja small{display:block;font-size:11px;color:var(--gris);margin-top:2px}
.burbuja.mia{align-self:flex-end;background:var(--marca);color:#fff;border-radius:16px 16px 4px 16px}
.burbuja.mia small{color:rgba(255,255,255,.75)}
.escribir{display:flex;gap:8px}
.escribir input{flex:1}
.punto{min-width:20px;height:20px;border-radius:999px;background:var(--mal);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;padding:0 6px}
.seg{display:inline-flex;background:var(--suave);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 12px;font-weight:700;font-size:13px;color:var(--gris);min-width:44px}
.seg button.on.P{background:var(--ok);color:#fff}.seg button.on.R{background:var(--aviso);color:#fff}.seg button.on.F{background:var(--mal);color:#fff}
.modo{display:flex;align-items:center;gap:10px;margin:10px 4px 0;padding:10px 12px;border-radius:12px;border:1.5px dashed #C9BCD9;color:var(--marca);font-weight:600;font-size:13px}
.modo svg{width:18px;height:18px;flex:none}
.prof .lateral .logo b,.prof .avatar{background:#145536}
.prof .nav a.activo{background:#1F5F45}
.visor-fondo{position:fixed;inset:0;background:rgba(28,20,38,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.visor{background:#fff;border-radius:20px;width:100%;max-width:1150px;height:min(92vh,980px);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.visor .cab{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--linea)}
.visor .cab b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visor .cab .ico{border:0;background:var(--suave);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;color:var(--marca)}
.visor .cab .ico svg{width:20px;height:20px}
.visor .cuerpo-v{display:grid;grid-template-columns:1fr;min-height:0}
.visor.con-panel .cuerpo-v{grid-template-columns:1fr 320px}
.visor-hojas{overflow:auto;background:#EEE9F6;padding:10px;min-height:0}
.visor-hojas canvas,.visor-hojas img{display:block;width:100%;max-width:820px;height:auto;margin:0 auto 10px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);border-radius:4px}
.visor-hojas iframe{width:100%;height:100%;min-height:70vh;border:0;border-radius:8px;background:#fff}
.visor-hojas pre{white-space:pre-wrap;margin:0 auto;max-width:820px;padding:16px;background:#fff;border-radius:8px;font-size:13px}
.visor-hojas .msj{text-align:center;color:var(--gris);padding:40px 16px;font-size:14px}
.panel-cal{border-left:1px solid var(--linea);padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.rapidas{display:flex;gap:6px;flex-wrap:wrap}
.rapidas button{border:0;background:var(--suave);color:var(--marca);font-weight:700;border-radius:10px;padding:8px 12px}
.rapidas button.on{background:var(--marca);color:#fff}
textarea{font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--linea);width:100%;min-height:90px;resize:vertical}
.tabs a.tab{background:#fff;color:var(--tinta);padding:9px 14px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tabs a.tab.activo{background:var(--marca);color:#fff}
.prof .tabs a.tab.activo,.prof .tabs button.activo{background:#1F5F45}
.fechas{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}
.fechas button{flex:none;border:1.5px solid var(--linea);background:#fff;border-radius:12px;padding:7px 10px;font-weight:600;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--tinta)}
.fechas button i,.pt{width:7px;height:7px;border-radius:50%;display:inline-block;background:#C9BCD9}
.pt{margin-right:5px;vertical-align:1px}
.fechas .tomada i,.pt.tomada{background:var(--ok)}.fechas .pend i,.pt.pend{background:var(--mal)}.fechas .sin i,.pt.sin{background:transparent;border:1.5px solid var(--gris)}
.fechas button.sin{color:var(--gris);text-decoration:line-through;background:#FAF8FC}
.fechas button.futura{color:var(--gris)}
.fechas button.activo{border-color:#1F5F45;background:#E8F2EC}
.semana a.cl{cursor:pointer}.semana a.cl:hover{filter:brightness(.96)}
.prof .semana .cl{border-left-color:#1F5F45;background:#EEF5F1}
.prof .hor .c{border-left-color:#1F5F45;background:#EEF5F1}
.menu-g{position:fixed;z-index:40;background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(28,20,38,.25);padding:8px;display:flex;flex-direction:column;min-width:220px}
.menu-g b{font-size:12px;color:var(--gris);padding:6px 10px}
.menu-g a{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;color:var(--tinta);font-weight:600;font-size:14px}
.menu-g a:hover{background:var(--suave)}.menu-g svg{width:18px;height:18px;color:#1F5F45}
.detalle{background:#fff;border-radius:20px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
tr[data-al]:hover td{background:var(--suave)}
.ico-adj{border:0;background:var(--suave);color:var(--marca);border-radius:12px;width:46px;flex:none;display:grid;place-items:center;cursor:pointer}
.ico-adj svg{width:20px;height:20px}
.ico-adj.on{background:var(--mal);color:#fff;animation:latido 1s ease-in-out infinite}
@keyframes latido{50%{transform:scale(1.08)}}
.escribir .tx{flex:1;min-width:0}
.adj-img{display:block;max-width:min(240px,100%);max-height:260px;border-radius:12px;margin:2px 0 6px;cursor:zoom-in}
.adj-audio audio{width:250px;max-width:100%;height:40px;display:block;margin-bottom:4px}
.adj-arch{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:rgba(255,255,255,.7);border-radius:12px;padding:8px 10px;margin-bottom:6px;color:inherit;max-width:260px}
.burbuja.mia .adj-arch{background:rgba(255,255,255,.16)}
.adj-arch svg{width:24px;height:24px;flex:none}.adj-arch b{display:block;font-size:13px;word-break:break-all}.adj-arch small{margin:0}
.tabs button.suave:not(.activo){background:var(--suave)}
/* Portada de Inicio: formas que flotan y se desvanece al bajar */
.portada{position:relative;overflow:hidden;min-height:210px;justify-content:flex-end;will-change:opacity,transform;transform-origin:top center}
.portada>*:not(.formas){position:relative}
.formas i{position:absolute;border-radius:50%;opacity:.5;animation:flota 9s ease-in-out infinite}
.formas i:nth-child(1){width:220px;height:220px;right:-50px;top:-70px;background:radial-gradient(circle at 30% 30%,#B57BEA,transparent 70%)}
.formas i:nth-child(2){width:140px;height:140px;right:120px;bottom:-60px;background:radial-gradient(circle at 50% 50%,#F2A65A,transparent 70%);animation-delay:-3s;opacity:.35}
.formas i:nth-child(3){width:90px;height:90px;right:40px;bottom:30px;background:radial-gradient(circle at 50% 50%,#7FD1B9,transparent 70%);animation-delay:-6s;opacity:.4}
@keyframes flota{50%{transform:translate(-14px,10px) scale(1.06)}}
.barra.sombra{box-shadow:0 6px 18px rgba(28,20,38,.08)}
/* Secciones que aparecen al bajar */
.revela{opacity:0;transform:translateY(18px);transition:opacity .5s ease,transform .5s ease}
.revela.visto{opacity:1;transform:none}
/* Botones y tarjetas que reaccionan al cursor */
.btn,.tabs button,.tabs a.tab,.rapidas button,.seg button,.dias button,.fechas button,.nav a,.ico-adj,.modo,.adj-arch{transition:transform .18s ease,background-color .18s ease,color .18s ease,box-shadow .18s ease}
a.tarjeta{transition:transform .22s ease,box-shadow .22s ease}
.btn:active,.ico-adj:active{transform:scale(.96)}
@media (hover:hover){
 .btn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 8px 18px rgba(75,26,120,.28)}
 .btn.sec:hover{background:var(--marca);color:#fff}
 .prof .btn.sec:hover{background:#1F5F45;box-shadow:0 8px 18px rgba(20,85,54,.28)}
 .tabs button:not(.activo):hover,.tabs a.tab:not(.activo):hover,.rapidas button:not(.on):hover,.ico-adj:hover{transform:translateY(-1px) scale(1.04);background:var(--marca);color:#fff}
 .prof .tabs button:not(.activo):hover,.prof .tabs a.tab:not(.activo):hover,.prof .rapidas button:not(.on):hover{background:#1F5F45}
 .nav a:not(.activo):hover{transform:translateX(4px)}
 .modo:hover{background:var(--suave);transform:translateX(3px)}
 a.tarjeta:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(28,20,38,.12)}
 .adj-arch:hover{transform:scale(1.02)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.revela{opacity:1;transform:none}}
.editor{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--linea);padding-top:12px}
.editor>b{font-size:13px;margin-top:4px}
.rubro{display:grid;grid-template-columns:1.2fr 1fr 96px 40px;gap:8px;align-items:center;margin-bottom:8px}
.rubro input,.rubro select{padding:10px 12px}
.rubro .rp{display:flex;align-items:center;gap:4px;font-weight:600;color:var(--gris)}
.rubro .rx{border:0;background:var(--malf);color:var(--mal);border-radius:10px;height:40px;display:grid;place-items:center}
.rubro .rx svg{width:16px;height:16px}
.mini-btn{border:0;background:var(--suave);color:var(--marca);border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;margin-top:4px}
.prof .mini-btn{color:#1F5F45}
input.cap{width:72px;padding:6px 8px;text-align:right;border-radius:8px}
.padre .lateral .logo b,.padre .avatar{background:#0E6E8C}

/* ===== Estilo limpio: neutro por defecto; el color solo en lo seleccionado ===== */
:root{--acento:var(--marca);--gris-hover:#F1EFF4}
.prof{--acento:#1F5F45}.padre{--acento:#0E6E8C}.admin{--acento:#1D2B4F}
:root,.app{--tinte:color-mix(in srgb,var(--acento) 10%,#fff)}
body{letter-spacing:-.006em}
h1,h2,h3{font-weight:600;letter-spacing:-.015em}
/* Menú lateral: gris suave al pasar, tinte del color en el seleccionado */
.app .nav a{color:#3A3344;font-weight:500;transform:none!important}
.app .nav a:hover{background:var(--gris-hover)}
.app .nav a.activo{background:var(--tinte);color:var(--acento);font-weight:600}
/* Pestañas y filtros: sin relleno; al pasar gris; seleccionada con tinte */
.app .tabs button,.app .tabs a.tab,.app .tabs button.suave:not(.activo){background:transparent;color:var(--gris);border:1px solid transparent}
.app .tabs button:not(.activo):hover,.app .tabs a.tab:not(.activo):hover{background:var(--gris-hover);color:var(--tinta);transform:none}
.app .tabs button.activo,.app .tabs a.tab.activo{background:var(--tinte);color:var(--acento);border-color:color-mix(in srgb,var(--acento) 22%,#fff)}
/* Etiquetas: neutras, con un punto de color que dice el estado */
.chip{background:#F2F0F4;color:#4A4255;font-weight:600}
.chip.ok,.chip.aviso,.chip.mal{background:#F2F0F4;color:#4A4255}
.chip.ok::before,.chip.aviso::before,.chip.mal::before{content:'';width:6px;height:6px;border-radius:50%;flex:none}
.chip.ok::before{background:var(--ok)}.chip.aviso::before{background:#E08A00}.chip.mal::before{background:var(--mal)}
.chip.mal{color:var(--mal)}
.chip:has(svg)::before{display:none}
/* Botones secundarios: blancos con borde; al pasar gris suave (sin brincar) */
.btn.sec,.app .btn.sec{background:#fff;color:var(--tinta);border:1px solid var(--linea)}
@media (hover:hover){
 .btn:hover,.app .btn:hover{transform:none;box-shadow:none;filter:brightness(1.12)}
 .btn.sec:hover,.app .btn.sec:hover{background:var(--gris-hover);color:var(--tinta);filter:none}
 .app .rapidas button:not(.on):hover,.ico-adj:hover{transform:none;background:var(--gris-hover);color:var(--tinta)}
 a.it:hover,.app .contactos .it:hover,.semana-asis>*:hover{background:var(--gris-hover)}
 a.it{border-radius:10px;margin:0 -8px;padding-left:8px!important;padding-right:8px!important}
}
.app .btn{background:var(--acento)}
.app .rapidas button{background:#fff;color:var(--tinta);border:1px solid var(--linea)}
.app .rapidas button.on{background:var(--tinte);color:var(--acento);border-color:color-mix(in srgb,var(--acento) 30%,#fff)}
.app .contactos .it.activo{background:var(--tinte)}
/* Acciones delicadas (borrar, quitar, baja): rojo; se marca al pasar como "Eliminar" */
[data-acc="baja"],[data-borra],[data-borra-cal],[data-quita-ex]{color:var(--mal)!important}
[data-acc="baja"]:hover,[data-borra]:hover,[data-borra-cal]:hover,[data-quita-ex]:hover{background:var(--malf)!important;border-color:var(--malf)!important}
/* Avisos importantes: borde fino y una línea de color a la izquierda, en lugar de marco grueso */
.tarjeta[style*="solid var(--aviso)"],.tarjeta[style*="solid var(--mal)"]{border:1px solid var(--linea)!important;box-shadow:inset 4px 0 0 #E08A00,0 1px 2px rgba(28,20,38,.04)}
.tarjeta[style*="solid var(--mal)"]{box-shadow:inset 4px 0 0 var(--mal),0 1px 2px rgba(28,20,38,.04)}
/* Menú rápido del grupo y hoja "Más" con el mismo estilo */
.menu-g a:hover,.hoja a:hover{background:var(--gris-hover)}

function calcPeriodo(g,m,n){

 const activos=partes.filter(x=>x.cp.pct>0),falta=activos.filter(x=>x.v==null),con=activos.filter(x=>x.v!=null),pctCon=con.reduce((a,x)=>a+ +x.cp.pct,0);
 return {per,ts,ent,pend,falt,total:ts.length,ses:ses.length,P,R,F,partes,falta,

}

function calcSemestre(g,m){
 const E=esq(g),ps=periodos(g).map(p=>calcPeriodo(g,m,p.n));

function pintarHorario(nombre,diaSel){
 const b=HORARIO.bloques.find(x=>x.nombre===nombre),c=clasesDe(b),el=document.getElementById('hc');
 const ahora=new Date(),hoy0=new Date(ahora);hoy0.setHours(0,0,0,0);
 const vigente=hoy0>=aFecha(b.del)&&hoy0<=aFecha(b.al),hoyDia=ahora.getDay(),m=ahora.getHours()*60+ahora.getMinutes();
 const enCurso=x=>vigente&&x.dia===hoyDia&&m>=min(x.i)&&m<min(x.f);
 const terminado=hoy0>aFecha(b.al),porEmpezar=hoy0<aFecha(b.del);
 const chip=terminado?'<span class="chip">Terminado</span>':porEmpezar?'<span class="chip aviso">Próximo</span>':'<span class="chip ok">En curso</span>';
 const conClase=[...new Set(c.map(x=>x.dia))];
 const dias=[1,2,3,4,5].concat(conClase.includes(6)?[6]:[]);
 const t0=Math.floor(Math.min(...c.map(x=>min(x.i)))/60)*60,t1=Math.ceil(Math.max(...c.map(x=>min(x.f)))/60)*60,paso=c.some(x=>min(x.i)%30||min(x.f)%30)?10:30,filas=(t1-t0)/paso,alto=paso===10?11:28;
 const fila=t=>2+Math.round((t-t0)/paso);
 let g='<div></div>'+dias.map((d,k)=>`<div class="cab ${vigente&&d===hoyDia?'hoy':''}" style="grid-column:${k+2}">${DIAS[d]}</div>`).join('');
 for(let r=0;r<filas;r++){const t=t0+r*paso;g+=`<div class="hr" style="grid-row:${r+2};grid-column:1">${t%60===0?hhmm(t):''}</div>`+dias.map((d,k)=>`<div class="celda" style="grid-row:${r+2};grid-column:${k+2}"></div>`).join('')}
 dias.forEach((d,k)=>{if(!conClase.includes(d))g+=`<div class="libre" style="grid-column:${k+2}"></div>`});
 g+=c.map(x=>`<div class="cl ${enCurso(x)?'ahora':''}" style="grid-column:${dias.indexOf(x.dia)+2};grid-row:${fila(min(x.i))}/${fila(min(x.f))}"><b>${nomMat(x.cl)}</b><span>${x.i}–${x.f}</span><span>${x.aula}</span><span>${x.prof}</span></div>`).join('');
 const sel=diaSel||(conClase.includes(hoyDia)?hoyDia:conClase[0]);
 const lista=c.filter(x=>x.dia===sel).map(x=>`<div class="b ${enCurso(x)?'ahora':''}"><div class="h">${x.i}<span>a ${x.f}</span></div><div class="c"><b>${nomMat(x.cl)}</b><span>${x.cl} · ${x.prof} · ${x.aula}</span></div></div>`).join('')||`<div class="vacio">${ic('cal')}Sin clases este día.</div>`;
 const resumen=conClase.map(d=>{const cd=c.filter(x=>x.dia===d);return `${DIAS[d].toLowerCase()} de ${cd[0].i} a ${cd.at(-1).f}`}).join(' · ');
 el.innerHTML=`<section class="tarjeta">
  <div class="fila"><div><h2>${b.nombre} · ${new Set(c.map(x=>x.cl)).size} materias</h2><span style="font-size:13px;color:var(--gris)">Del ${b.del} al ${b.al} · ${resumen}</span></div>${chip}</div>
  <div class="semana solo-escritorio" style="grid-template-columns:52px repeat(${dias.length},1fr);grid-template-rows:auto repeat(${filas},${alto}px)">${g}</div>
  <div class="solo-movil"><div class="dias" id="hd">${dias.map(d=>`<button data-d="${d}" class="${d===sel?'activo':''} ${conClase.includes(d)?'':'sin'}">${DIAS[d].slice(0,3)}</button>`).join('')}</div><div class="hor">${lista}</div></div>
 </section>`;
 document.querySelectorAll('#hb button').forEach(x=>x.classList.toggle('activo',x.dataset.b===nombre));
 document.getElementById('hd').onclick=e=>{const k=e.target.closest('button');if(k)pintarHorario(nombre,+k.dataset.d)};
}

// ---------- Adjuntos en mensajes: fotos, audios (también notas de voz) y archivos ----------
const ADJ=[],GRAB={rec:null,cancelar:false};
const pesoTxt=b=>b<1048576?Math.max(1,Math.round(b/1024))+' KB':(b/1048576).toFixed(1)+' MB';
const esAudio=a=>/^audio\//.test(a.blob.type)||/\.(mp3|m4a|wav|ogg|webm|opus|aac)$/i.test(a.nombre);
const previaMsg=(t,a)=>t||(a?(a.voz?'Nota de voz':VISOR.tipo(a.nombre,a.blob.type)==='imagen'?'Foto':esAudio(a)?'Audio':'Archivo: '+a.nombre):'');
function adjHTML(a){
 if(!a)return '';let i=ADJ.indexOf(a);if(i<0)i=ADJ.push(a)-1;a.url=a.url||URL.createObjectURL(a.blob);
 if(VISOR.tipo(a.nombre,a.blob.type)==='imagen')return `<img class="adj-img" src="${a.url}" alt="${esc(a.nombre)}" data-adj="${i}">`;
 if(esAudio(a))return `<div class="adj-audio">${a.voz?'<small style="margin:0 0 4px;font-weight:700">Nota de voz</small>':`<small style="margin:0 0 4px">${esc(a.nombre)}</small>`}<audio controls preload="metadata" src="${a.url}"></audio></div>`;
 return `<button type="button" class="adj-arch" data-adj="${i}">${ic('docs')}<span><b>${esc(a.nombre)}</b><small>${pesoTxt(a.blob.size)} · ver sin descargar</small></span></button>`;
}
const burbuja=(mia,t,f,a,extra='')=>`<div class="burbuja ${mia?'mia':''}">${extra}${adjHTML(a)}${t?esc(t):''}<small>${f}</small></div>`;
function abrirAdj(e){const x=e.target.closest('[data-adj]');if(!x)return false;const a=ADJ[x.dataset.adj];VISOR.abrir({nombre:a.nombre,blob:a.blob});return true}
const barraEscribir=(id,ph)=>`<form class="escribir" id="${id}"><label class="ico-adj" title="Mandar foto, audio o archivo" aria-label="Mandar foto, audio o archivo">${ic('clip')}<input type="file" hidden accept="image/*,audio/*,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt"></label><button type="button" class="ico-adj grabar" title="Grabar nota de voz" aria-label="Grabar nota de voz">${ic('mic')}</button><input class="tx" placeholder="${ph}" autocomplete="off"><button class="btn" aria-label="Enviar">${ic('enviar','style="width:18px;height:18px;vertical-align:-3px"')}</button></form>`;
function conectarEscribir(form,enviar){ // enviar(texto, adjunto|null)
 const tx=form.querySelector('.tx');
 form.onsubmit=e=>{e.preventDefault();const v=tx.value.trim();if(v)enviar(v,null)};
 form.querySelector('input[type=file]').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>25*1048576)return alert('El archivo pesa más de 25 MB.');enviar(tx.value.trim(),{nombre:f.name,blob:f})};
 const gb=form.querySelector('.grabar');
 gb.onclick=async()=>{
  if(GRAB.rec){GRAB.rec.stop();return}
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return alert('Este navegador no deja grabar audio aquí. Puedes mandar un audio con el clip.');
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(err){return alert('No se pudo usar el micrófono. Revisa que el navegador tenga permiso.')}
  const rec=new MediaRecorder(st,{audioBitsPerSecond:24000}),partes=[],t0=Date.now(),ph=tx.placeholder;GRAB.rec=rec;GRAB.cancelar=false;
  gb.classList.add('on');tx.disabled=true;
  const tm=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);tx.placeholder=`Grabando ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} · toca el micrófono para enviar`},250);
  rec.ondataavailable=e=>partes.push(e.data);
  rec.onstop=()=>{clearInterval(tm);st.getTracks().forEach(t=>t.stop());GRAB.rec=null;gb.classList.remove('on');tx.disabled=false;tx.placeholder=ph;
   if(GRAB.cancelar)return;const blob=new Blob(partes,{type:rec.mimeType||'audio/webm'});if(blob.size<500)return;
   enviar('',{nombre:'Nota de voz.'+(/mp4|aac/.test(blob.type)?'m4a':'webm'),blob,voz:true})};
  rec.start();
 };
}

// ---------- Visor de archivos (misma idea que en turbinas: vista previa sin descargar) ----------
const VISOR={
 pdfjs:null,
 cargarPdfjs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  if(!this.pdfjs)this.pdfjs=new Promise((ok,mal)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';sc.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';ok(pdfjsLib)};sc.onerror=()=>{this.pdfjs=null;mal(new Error('pdfjs'))};document.head.appendChild(sc)});
  return this.pdfjs;
 },
 tipo(n,m=''){n=String(n||'').toLowerCase();
  if(/^image\//.test(m)||/\.(png|jpe?g|gif|webp|bmp)$/.test(n))return 'imagen';
  if(/pdf/.test(m)||n.endsWith('.pdf'))return 'pdf';
  if(/\.(docx?|pptx?|xlsx?)$/.test(n))return 'office';
  if(/^text\//.test(m)||/\.(txt|md|csv)$/.test(n))return 'texto';
  return 'otro'},
 cerrar(){document.querySelector('.visor-fondo')?.remove();document.removeEventListener('keydown',VISOR._esc)},
 _esc(e){if(e.key==='Escape')VISOR.cerrar()},
 // {nombre, url?, blob?, panel?: html del panel lateral (calificar)}
 async abrir({nombre,url,blob,panel}){
  this.cerrar();
  const d=document.createElement('div');d.className='visor-fondo';
  d.innerHTML=`<div class="visor ${panel?'con-panel':''}"><div class="cab"><b>${esc(nombre||'Archivo')}</b><button class="ico" id="vb" aria-label="Descargar" title="Descargar">${ic('bajar')}</button><button class="ico" id="vc" aria-label="Cerrar">${ic('cerrar')}</button></div>
   <div class="cuerpo-v"><div class="visor-hojas" id="vh"><div class="msj">Abriendo…</div></div>${panel?`<aside class="panel-cal" id="vp">${panel}</aside>`:''}</div></div>`;
  d.onclick=e=>{if(e.target===d)VISOR.cerrar()};
  document.body.appendChild(d);document.addEventListener('keydown',VISOR._esc);
  document.getElementById('vc').onclick=()=>VISOR.cerrar();
  const caja=()=>document.getElementById('vh'),t=this.tipo(nombre,blob?.type);
  const msj=x=>{if(caja())caja().innerHTML=`<div class="msj">${x}</div>`};
  if(!blob&&url)blob=await fetch(url).then(r=>r.ok?r.blob():null).catch(()=>null);
  document.getElementById('vb').onclick=()=>{if(!blob)return alert('Prototipo: este archivo de ejemplo no tiene contenido para descargar.');const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),6e4)};
  if(!blob&&!url)return msj('Esta entrega se registró en el salón, así que no hay archivo que mostrar.');
  if(t==='office')return msj(`${ic('docs','style="width:40px;height:40px;color:#C9BCD9;display:block;margin:0 auto 8px"')}Los archivos de Word, Excel y PowerPoint se ven aquí cuando la plataforma tiene servidor (con el visor de Microsoft).<br>En este prototipo, descárgalo para abrirlo.<br><br><b>Tip para alumnos:</b> si lo entregas en PDF, el profesor lo lee al instante.`);
  if(!blob)return msj('No se pudo abrir el archivo. Revisa tu internet.');
  const u=URL.createObjectURL(blob);
  if(t==='imagen')return caja().innerHTML=`<img src="${u}" alt="${esc(nombre)}">`;
  if(t==='texto')return caja().innerHTML=`<pre>${esc((await blob.text()).slice(0,200000))}</pre>`;
  if(t!=='pdf')return msj('Este tipo de archivo no tiene vista previa. Descárgalo para abrirlo.');
  try{
   const lib=await this.cargarPdfjs(),doc=await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise,c=caja();if(!c)return;
   c.innerHTML=`<div style="text-align:center;font-size:12px;color:var(--gris);margin-bottom:6px">${doc.numPages} página${doc.numPages>1?'s':''}</div>`;
   const ancho=Math.min(c.clientWidth-20,820),max=Math.min(doc.numPages,60);
   for(let n=1;n<=max;n++){if(!caja())return;const pg=await doc.getPage(n),v0=pg.getViewport({scale:1}),v=pg.getViewport({scale:ancho/v0.width*(devicePixelRatio||1)}),cv=document.createElement('canvas');cv.width=v.width;cv.height=v.height;c.appendChild(cv);await pg.render({canvasContext:cv.getContext('2d'),viewport:v}).promise}
  }catch(e){if(caja())caja().innerHTML=`<iframe title="${esc(nombre)}" src="${u}"></iframe>`}
 }
};

function pintarListaG(g,fecha){

 if(!conClase(fecha))cuerpo=`<div class="vacio">${ic('cal')}Sin clase este ${diaTxt(fecha).toLowerCase()}: ${CAL.inhabiles[fecha]}.<br>Lo marca el calendario escolar, así que no cuenta para la asistencia.</div>`;
 else if(!yaPaso(fecha)&&fecha!==fTxt(hoy0()))cuerpo=`<div class="vacio">${ic('reloj')}Esta clase todavía no llega. El ${fCorta(fecha)} podrás pasar lista desde aquí.</div>`;
 else{

function detalleAlumno(g,m){

   return `<div class="campo"><small>${esc(cp.nombre)} (${cp.pct} %)</small>${det}${cp.pct?aporte:' · <span style="color:var(--gris)">no cuenta</span>'}</div>`};

let observador=null;
function revelar(){
 if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 observador?.disconnect();observador=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('visto');observador.unobserve(x.target)}}),{threshold:.08});
 document.querySelectorAll('main > *:not(#portada)').forEach((el,i)=>{el.classList.add('revela');el.style.transitionDelay=Math.min(i,5)*60+'ms';observador.observe(el)});
}
